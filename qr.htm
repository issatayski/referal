<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-код для записи — Центр очищения организма</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#eef2f8;color:#12213d}
.sheet{max-width:420px;margin:0 auto;background:#fff;min-height:100vh;padding:24px 20px 40px;text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,.08)}
img.logo{width:100%;max-width:280px;height:auto;margin-bottom:18px}
h1{font-size:24px;margin:0 0 6px;color:#0b2a6b}
p.lead{font-size:17px;color:#5b6b86;margin:0 0 20px;line-height:1.45}
.qr{border:2px solid #e3e9f2;border-radius:18px;padding:14px;display:inline-block;background:#fff}
.qr img{width:250px;height:250px;display:block}
.code{margin:14px 0 4px;font-size:15px;color:#5b6b86}
.code b{color:#0b2a6b}
a.link{display:block;word-break:break-all;font-size:14px;color:#c8102e;margin-bottom:22px}
.btns{display:flex;flex-direction:column;gap:10px}
.btns a,.btns button{font:inherit;font-size:16px;font-weight:700;padding:14px;border-radius:12px;border:0;
  text-decoration:none;cursor:pointer}
.b1{background:#0b2a6b;color:#fff}
.b2{background:#fff;color:#0b2a6b;border:2px solid #0b2a6b}
.hint{margin-top:22px;font-size:14px;color:#7b8aa3;line-height:1.5}
@media print{body{background:#fff}.btns,.hint{display:none}.sheet{box-shadow:none}}
</style>
</head>
<body>
<div class="sheet">
  <img class="logo" src="iogo.png" alt="Центр очищения организма">
  <h1>Наведите камеру на QR-код</h1>
  <p class="lead">Запись на <b>бесплатный осмотр</b> — 20 секунд, нужны только имя и телефон.</p>

  <div class="qr"><img src="qr-demo.png" alt="QR-код записи"></div>

  <a class="link" href="https://issatayski.github.io/referal/">https://issatayski.github.io/referal/</a>

  <div class="btns">
    <a class="b1" href="index.htm">Открыть страницу записи</a>
    <a class="b2" href="qr-demo.png" download>Скачать QR (PNG)</a>
    <button class="b2" onclick="window.print()">Печать памятки</button>
  </div>

  <div class="hint">Пациент наводит камеру → открывается страница записи → имя и телефон попадают в Google Таблицу.</div>
</div>
</body>
</html>
